name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant to build"
        required: true
        default: all
        type: choice
        options:
          - base
          - su
          - all

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # --------------------------
      # Checkout kernel (shallow)
      # --------------------------
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # --------------------------
      # Install dependencies
      # --------------------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential \
            curl flex git libssl-dev \
            python3 rsync unzip cpio \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi zip

      # --------------------------
      # Cache Clang
      # --------------------------
      - name: Cache Clang
        uses: actions/cache@v3
        with:
          path: clang
          key: clang-r563880c

      # --------------------------
      # Setup Clang
      # --------------------------
      - name: Setup Clang
        run: |
          if [ ! -d clang/bin ]; then
            mkdir -p clang
            curl -L \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r584948.tar.gz \
              | tar -xz -C clang
          fi
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      # --------------------------
      # Build Variants
      # --------------------------
      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          TARGET="${{ github.event.inputs.variant }}"

          if [ "$TARGET" = "all" ]; then
            VARIANTS=("su" "base")
          else
            VARIANTS=("$TARGET")
          fi

          DATE_TIME=$(TZ="Asia/Karachi" date +"%d%m%y-%H%M%S")

          for VARIANT in "${VARIANTS[@]}"; do
            echo "=================================="
            echo "Building variant: $VARIANT"
            echo "=================================="

            # Reset tracked files (preserve out/, clang/, anykernel-*)
            git reset --hard HEAD
            git clean -fdx -e out/ -e clang/ -e 'anykernel-*/'
            mkdir -p out

            # --------------------------
            # Branch mapping
            # --------------------------
            BRANCH="16.0-perf-ksu"

            # --------------------------
            # Clone KernelSU (only for su )
            # --------------------------
            if [ "$VARIANT" = "su" ]; then
              echo "Cloning KernelSU"
              rm -rf KernelSU
              curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -
            fi

            # --------------------------
            # Defconfig
            # --------------------------
            make O=out vendor/spes-stock_defconfig vendor/xiaomi/spes.config          
            LOCALVERSION="-$VARIANT"
            scripts/config --file out/.config -d CONFIG_KSU_TAMPER_SYSCALL_TABLE
            if [ "$VARIANT" = "base" ]; then
              scripts/config --file out/.config -d CONFIG_KSU
              scripts/config --file out/.config -d CONFIG_KSU_FEATURE_SULOG
              scripts/config --file out/.config -d CONFIG_KSU_FEATURE_ADBROOT
              scripts/config --file out/.config -d CONFIG_KSU_DEBUG
              scripts/config --file out/.config -d CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED
              scripts/config --file out/.config -d CONFIG_KSU_LSM_SECURITY_HOOKS
            fi

            make O=out olddefconfig

            # --------------------------
            # Compile
            # --------------------------
            make -j$(nproc) O=out LOCALVERSION=$LOCALVERSION Image.gz-dtb dtbo.img

            # --------------------------
            # AnyKernel Packaging
            # --------------------------
            ANYKERNEL_DIR="anykernel-$VARIANT"
            if [ ! -d "$ANYKERNEL_DIR" ]; then
              git clone --depth=1 https://github.com/ahmedhanbal/anykernel "$ANYKERNEL_DIR"
            fi

            cp out/arch/arm64/boot/Image.gz-dtb "$ANYKERNEL_DIR/"
            cp out/arch/arm64/boot/dtbo.img "$ANYKERNEL_DIR/"

            sed -i "s/^kernel.string=.*/kernel.string=hanbal-gforce-$VARIANT/" \
              "$ANYKERNEL_DIR/anykernel.sh"

            rm -rf "$ANYKERNEL_DIR/.git"

          done

      # --------------------------
      # Save Clang Cache always
      # --------------------------
      - name: Save Clang Cache
        if: always()
        uses: actions/cache@v3
        with:
          path: clang
          key: clang-r563880c

      # --------------------------
      # Timestamp
      # --------------------------
      - name: Generate timestamp
        id: timestamp
        run: echo "time=$(TZ='Asia/Karachi' date +'%d%m%y-%H%M%S')" >> $GITHUB_OUTPUT

      # --------------------------
      # Upload Artifacts
      # --------------------------
      - name: Upload base
        if: ${{ github.event.inputs.variant == 'base' || github.event.inputs.variant == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: hanbal-gforce-base-${{ steps.timestamp.outputs.time }}
          path: anykernel-base/

      - name: Upload su
        if: ${{ github.event.inputs.variant == 'su' || github.event.inputs.variant == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: hanbal-gforce-su-${{ steps.timestamp.outputs.time }}
          path: anykernel-su/
