name: Build Recovery Flashable Zip

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant to build"
        required: false
        default: all
        type: choice
        options:
          - base
          - suNext
          - suNext-M
          - all

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # --------------------------
      # Checkout kernel
      # --------------------------
      - name: Checkout kernel
        uses: actions/checkout@v4

      # --------------------------
      # Remove KernelSU-Next submodule if exists
      # --------------------------
      - name: Remove existing KernelSU-Next
        run: |
          rm -rf KernelSU-Next
          rm -f drivers/kernelsu
          echo "Cleaned up any existing KernelSU-Next"

      # --------------------------
      # Install dependencies
      # --------------------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential \
            curl flex git libssl-dev \
            python3 rsync unzip cpio \
            gcc-aarch64-linux-gnu python-is-python3 \
            gcc-arm-linux-gnueabi zip

      # --------------------------
      # Cache Clang
      # --------------------------
      - name: Cache Clang
        uses: actions/cache@v3
        id: cache
        with:
          path: clang
          key: clang-r563880c

      # --------------------------
      # Setup Google Clang r563880c
      # --------------------------
      - name: Setup Google Clang r563880c
        run: |
          if [ ! -d clang/bin ]; then
            mkdir -p clang
            curl -L \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r563880c.tar.gz \
              | tar -xz -C clang
          fi

          echo "$PWD/clang/bin" >> $GITHUB_PATH

      # --------------------------
      # Build kernel variants
      # --------------------------
      - name: Build kernel variants
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          VARIANTS=()
          if [[ "${{ github.event.inputs.variant }}" == "all" ]]; then
            VARIANTS=(base suNext suNext-M)
          else
            VARIANTS=(${{ github.event.inputs.variant }})
          fi

          for VARIANT in "${VARIANTS[@]}"; do
            echo "=============================="
            echo "Building variant: $VARIANT"
            echo "=============================="

            # Reset repo clean (preserve out/ for speed)
            git reset --hard HEAD
            git clean -fdx -e out/ -e clang/ -e 'anykernel-*/'
            mkdir -p out

            # Clean KernelSU files
            rm -rf KernelSU-Next
            rm -f drivers/kernelsu

            # Setup KernelSU-Next for suNext + suNext-M
            if [[ "$VARIANT" == "suNext" || "$VARIANT" == "suNext-M" ]]; then
              echo "Setting up KernelSU-Next..."
              curl -LSs \
                "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
                | bash -s legacy
            fi

            # Create initial config if missing
            if [ ! -f "out/.config" ]; then
              echo "Creating initial .config from defconfig"
              cp arch/arm64/configs/vendor/spes-stock_defconfig out/.config
            fi

            # --------------------------
            # Variant-specific config
            # --------------------------
            if [ "$VARIANT" = "suNext" ]; then
              echo "Enabling KernelSU (Kprobes hook)..."
              scripts/config --file out/.config -e CONFIG_KSU
              scripts/config --file out/.config -d CONFIG_KSU_MANUAL_HOOK
              scripts/config --file out/.config -e CONFIG_KSU_KPROBES_HOOK
              export LOCALVERSION=-suNext

            elif [ "$VARIANT" = "suNext-M" ]; then
              echo "Enabling KernelSU (Manual hooks)..."
              scripts/config --file out/.config -e CONFIG_KSU
              scripts/config --file out/.config -e CONFIG_KSU_MANUAL_HOOK
              scripts/config --file out/.config -d CONFIG_KSU_KPROBES_HOOK
              export LOCALVERSION=-suNext-M

            else
              echo "Disabling KernelSU..."
              scripts/config --file out/.config -d CONFIG_KSU
              export LOCALVERSION=-base
            fi

            # Refresh config
            make O=out olddefconfig

            # --------------------------
            # Compile kernel
            # --------------------------
            make -j$(nproc) O=out LOCALVERSION=$LOCALVERSION Image.gz-dtb dtbo.img

            # --------------------------
            # Prepare AnyKernel folder
            # --------------------------
            ANYKERNEL_DIR="anykernel-$VARIANT"
            rm -rf "$ANYKERNEL_DIR"
            git clone --depth=1 https://github.com/ahmedhanbal/AnyKernel "$ANYKERNEL_DIR"

            cp out/arch/arm64/boot/Image.gz-dtb "$ANYKERNEL_DIR/"
            cp out/arch/arm64/boot/dtbo.img "$ANYKERNEL_DIR/"

            # Patch kernel string
            sed -i "s/^kernel.string=.*/kernel.string=4.19.325-hanbal-gforce-$VARIANT/" \
              "$ANYKERNEL_DIR/anykernel.sh"

            # Remove git metadata
            rm -rf "$ANYKERNEL_DIR/.git" \
                   "$ANYKERNEL_DIR/.gitignore" \
                   "$ANYKERNEL_DIR/.gitattributes"

          done

      # --------------------------
      # Generate timestamp
      # --------------------------
      - name: Generate timestamp
        id: timestamp
        run: echo "time=$(TZ='Asia/Karachi' date +'%d%m%y-%H%M%S')" >> $GITHUB_OUTPUT

      # --------------------------
      # Upload artifacts
      # --------------------------
      - name: Upload base artifact
        if: ${{ github.event.inputs.variant == 'base' || github.event.inputs.variant == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: Hanbal-gforce-base-${{ steps.timestamp.outputs.time }}
          path: anykernel-base/

      - name: Upload suNext artifact
        if: ${{ github.event.inputs.variant == 'suNext' || github.event.inputs.variant == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: Hanbal-gforce-suNext-${{ steps.timestamp.outputs.time }}
          path: anykernel-suNext/

      - name: Upload suNext-M artifact
        if: ${{ github.event.inputs.variant == 'suNext-M' || github.event.inputs.variant == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: Hanbal-gforce-suNext-M-${{ steps.timestamp.outputs.time }}
          path: anykernel-suNext-M/
